#import "../../customers/graphql/fragmentCustomer.graphql"
#import "../../workspace-branches/graphql/fragmentWorkspaceBranch.graphql"
#import "../../workspace-members/graphql/fragmentWorkspaceMember.graphql"

query Receipts($limit: Float, $offset: Float, $query: JSONObject) {
  list: receipts(limit: $limit, offset: $offset, query: $query) {
    total
    results {
      refs
      createdAt
      updatedAt
      id
      _count
      _id
      code
      ref
      type
      amount
      tipAmount
      giveAmount
      paidAt
      relatedCustomerId
      relatedTicketId
      relatedOrderId
      relatedLoanId
      relatedLoanCode
      relatedPartnerId
      cashierUserId
      disbursementUserId
      note
      data
      assigneeUserIds
      paymentMethod
      expireAt
      status

      relatedCustomer {
        ...CustomerData
      }
      workspaceBranch {
        ...WorkspaceBranchData
      }
      cashierUser {
        ...WorkspaceMemberData
      }
      disbursementUser {
        ...WorkspaceMemberData
      }
    }
  }
}