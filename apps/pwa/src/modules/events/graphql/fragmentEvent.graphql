#import "../../workspace-members/graphql/fragmentWorkspaceMember.graphql"

fragment Event on Event {
  _id
  ref
  time
  type
  typeName
  channel
  userId
  actionType
  data
  persist
  variant
  sessionId
  relatedEntities {
    entity
    id
    data
    index
  }
  user {
    ...WorkspaceMember
  }
}
