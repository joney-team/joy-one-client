query Promotions($limit: Float, $offset: Float, $query: JSONObject) {
  list: promotions(limit: $limit, offset: $offset, query: $query) {
    total
    results {
      refs
      createdAt
      updatedAt
      id
      _count
      _id
      name
      description
      image
      limitPerCustomer
      type
      value
      productsSelection
      customersSelection
      expireAt
      status
    }
  }
}