#import "../../workspaces/graphql/fragmentWorkspace.graphql"

fragment WorkspaceMember on WorkspaceMember {
  _id
  userId
  name
  email
  phone
  color
  avatar
  memberId
  workspaceId
  workspace {
    ...Workspace
  }
  workspaceBranches {
    _id
    name
    hotline
  }
  roles {
    _id
    name
    color
  }
  permissions
  workingTimeType
  memberDisplayName
  joinedAt
}
