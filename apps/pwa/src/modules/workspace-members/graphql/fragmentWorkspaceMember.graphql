#import "../../workspaces/graphql/fragmentWorkspace.graphql"

fragment WorkspaceMemberData on WorkspaceMember {
  _id
  userId
  name
  email
  phone
  color
  avatar
  memberId
  workspaceId
  workspace {
    ...WorkspaceData
  }
  workspaceBranches {
    _id
    name
  }
  roles {
    _id
    name
    color
  }
  permissions
  workingTimeType
  memberDisplayName
  joinedAt
}
