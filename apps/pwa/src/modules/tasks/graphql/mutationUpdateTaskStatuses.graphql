mutation UpdateTaskStatuses(
  $statuses: [TaskStatusInput!]!
  $contextType: TaskContextType
  $contextId: String
  $isInherited: Boolean
) {
  updateTaskStatuses(
    statuses: $statuses
    contextType: $contextType
    contextId: $contextId
    isInherited: $isInherited
  ) {
    id
    name
    color
    order
    contextId
    contextType
  }
}
