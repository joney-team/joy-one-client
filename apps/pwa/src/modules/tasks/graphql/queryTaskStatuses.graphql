query TaskStatuses(
  $contextType: TaskStatusesContextType
  $contextId: String
  $mode: GetTaskStatusesMode
) {
  taskStatuses(contextType: $contextType, contextId: $contextId, mode: $mode) {
    isInherited
    statuses {
      id
      name
      color
      order
      contextId
      contextType
    }
    workspaceStatuses {
      id
      name
      color
      order
      contextId
      contextType
    }
  }
}
