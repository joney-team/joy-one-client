#import "./fragmentTaskStatus.graphql"

query TaskStatuses(
  $contextType: TaskContextType
  $contextId: String
  $mode: GetTaskStatusesMode
) {
  taskStatuses(contextType: $contextType, contextId: $contextId, mode: $mode) {
    isInherited
    statuses {
      ...TaskStatusData
    }
    workspaceStatuses {
      ...TaskStatusData
    }
  }
}
