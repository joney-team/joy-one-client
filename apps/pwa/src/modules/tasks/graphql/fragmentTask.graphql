#import "../../workspace-members/graphql/fragmentWorkspaceMember.graphql"
#import "../../customers/graphql/fragmentCustomer.graphql"
#import "./fragmentTaskStatus.graphql"
#import "./fragmentTaskTimeTracking.graphql"

fragment Task on Task {
  _id
  code
  name
  description
  status
  order

  childCount
  childOrder {
    first
    last
  }
  childTimeline {
    startDate
    dueDate
  }

  startDate
  dueDate

  estimatedTime
  childEstimatedTime

  priority
  progress
  childProgress

  partners {
    _id
    name
    logo
  }

  assigneeUsers {
    ...WorkspaceMember
  }

  customer {
    ...Customer
  }

  parentId
  parent {
    _id
    name
    code
    order

    folderId
    folder {
      _id
      color
      name
      slug
    }
  }

  tags {
    _id
    color
    name
  }

  folderId
  folder {
    _id
    color
    name
    slug
  }

  timeTrackings {
    ...TaskTimeTrackingData
  }

  statuses {
    ...TaskStatusData
  }

  createdAt
  isArchived
}
