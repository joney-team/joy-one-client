query TasksCount(
  $folderId: String
  $parentId: String
  $status: String
  $offset: Float
  $limit: Float
  $ids: [String!]
  $assigneeUserIds: [String!]
  $partnerIds: [String!]
  $tagIds: [String!]
  $priority: TaskPriority
  $all: Boolean
) {
  tasksCount(
    folderId: $folderId
    parentId: $parentId
    status: $status
    offset: $offset
    limit: $limit
    ids: $ids
    assigneeUserIds: $assigneeUserIds
    partnerIds: $partnerIds
    tagIds: $tagIds
    priority: $priority
    all: $all
  )
}
