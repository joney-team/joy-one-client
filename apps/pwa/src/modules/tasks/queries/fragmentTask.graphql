fragment TaskData on Task {
  _id
  code
  name
  description
  status
  order

  folderId
  childCount

  startDate
  dueDate
  estimatedTime

  priority
  progress

  partners {
    _id
    name
    logo
  }

  assigneeUsers {
    _id
    userId
    name
    color
    avatar
    roles {
      _id
      name
      color
    }
  }

  customer {
    _id
    name
    avatar
    phone
  }

  parentId
  parent {
    _id
    name
    code
  }

  tags {
    _id
    color
    name
  }

  folder {
    _id
    color
    name
  }

  timeTrackings {
    id
    workspaceId
    userId
    user {
      _id
      name
      color
      avatar
    }
    billable
    note
    startAt
    endAt
  }

  createdAt
  isArchived
}
