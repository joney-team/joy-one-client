#import "./fragmentActivity.graphql"

query Activities(
  $contextType: String!
  $contextId: String!
  $type: ActivityType
  $offset: Float
  $limit: Float
  $ids: [String!]
  $sortCreatedAt: SortDirection
  $parentId: String
) {
  activities(
    contextType: $contextType
    contextId: $contextId
    type: $type
    offset: $offset
    limit: $limit
    ids: $ids
    sortCreatedAt: $sortCreatedAt
    parentId: $parentId
  ) {
    total
    results {
      ...ActivityData
    }
  }
}
