#import "../../workspace-members/graphql/fragmentWorkspaceMember.graphql"

fragment ActivityData on Activity {
  _id
  contextType
  contextId
  type
  content
  contentLastModifiedAt
  data
  parentId
  childCount
  isPinned
  createdAt
  updatedAt
  reactionsCount {
    reactions {
      userIds
      type
      count
    }
  }
  createdByUser {
    ...WorkspaceMemberData
  }
}
