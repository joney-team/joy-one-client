query CustomFields($limit: Float, $offset: Float, $query: JSONObject) {
  list: customFields(limit: $limit, offset: $offset, query: $query) {
    total
    results {
      refs
      createdAt
      updatedAt
      _id
      customFieldValues {
        type
        key
        config
        customFieldId
        value
      }
      type
      key
      label
      order
      config
      description
      placeholder
      entities
    }
  }
}