fragment WorkspaceSetting on WorkspaceSetting {
  schedule {
    timezone
    workingDays {
      id
      day
      start
      end
      shift
    }
  }
  bankAccount {
    bankId
    accountNumber
    accountName
  }
  mailer {
    user
    pass
  }
  bookingsAutoRemindCustomerBookingBeforeDays
  allowTip
  allowDuplicateBookings
  memberPermissions
  bookingsAutoRemindCustomerBookingTime
  loanSettings {
    loanPackages {
      id
      assetTypes
      type
      days
      periodDaysOptions
      contractFee
      unFixedCapitalRates
      lateInterestRates {
        lateDays
        rate
      }
      description
      liquidationFeeRate
    }
    assetEstimationPriceSpreadRate
    liquidationFeeRate
    warningReceiptBeforeDays
    isAutoSelectWorkspaceBranch
    contractPdfUrl
    contractLiquidationPdfUrl
    receiptPdfUrl
  }
  termsOfService
  privacyPolicy
  receiptImagesRequired
  receiptPaymentMethodDefault
  view {
    menu {
      id
      type
      moduleId
      dividerName
    }
    dashboardWidgets {
      id
      type
      state
    }
    reportWidgets {
      id
      type
      state
    }
  }
  searchSettings {
    hideEntities
  }
  currencyCode
  isAuthSessionRestricted
  zaloOaGmfGroupSettings
  allowPayTicketMultipleTimes
}
