query Posts($limit: Float, $offset: Float, $query: JSONObject) {
  list: posts(limit: $limit, offset: $offset, query: $query) {
    total
    results {
      refs
      createdAt
      updatedAt
      _id
      customFieldValues {
        customFieldId
        value
      }
      title
      slug
      excerpt
      content
      contentHtml
      thumbnail
      meta
      publishedAt
      categoryId
      productId
    }
  }
}