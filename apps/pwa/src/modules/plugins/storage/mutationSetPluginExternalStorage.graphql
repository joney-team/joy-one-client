mutation SetPluginExternalStorage(
  $provider: PluginExternalStorageProvider!
  $accessKeyId: String
  $secretAccessKey: String
  $region: String
  $bucketName: String
  $endpointUrl: String
) {
  setPluginExternalStorage(
    provider: $provider
    accessKeyId: $accessKeyId
    secretAccessKey: $secretAccessKey
    region: $region
    bucketName: $bucketName
    endpointUrl: $endpointUrl
  ) {
    provider
    region
    bucketName
    endpointUrl
  }
}
