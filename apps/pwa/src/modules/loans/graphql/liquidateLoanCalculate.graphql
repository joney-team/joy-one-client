query LiquidateLoanCalculate($loanId: String!) {
  liquidateLoanCalculate(id: $loanId) {
    capitalAmount
    paidAmount
    avancedPaymentAmount
    remainCapitalAmount
    remainCapitalAmountFeePercent
    remainCapitalAmountFee
    period
    periodFeePerDay
    periodFeeAmount
    periodFeeDays
    periodStartAt
    feeAmount
    lateInterestAmount
  }
}