query Loans(
  $customerCidNumber: String
  $status: [LoanStatus!]
  $limit: Float
  $offset: Float
  $sortCreatedAt: SortDirection
) {
  loans(
    customerCidNumber: $customerCidNumber
    status: $status
    limit: $limit
    offset: $offset
    sortCreatedAt: $sortCreatedAt
  ) {
    data {
      id
      code
      status
      amount
      customerCidNumber
      assetType
      rejectReason
      createdAt
      isHasLateInterestReceipt
    }
    count
  }
}
