#import "./fragmentWorkspaceRole.graphql"

mutation UpdateWorkspaceRole(
  $id: String!
  $name: String!
  $permissions: [String!]!
  $description: String
  $color: String
) {
  updateWorkspaceRole(
    _id: $id
    name: $name
    permissions: $permissions
    description: $description
    color: $color
  ) {
    ...WorkspaceRoleData
  }
}
