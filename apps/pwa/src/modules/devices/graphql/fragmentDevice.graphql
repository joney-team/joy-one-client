fragment Device on Device {
  _id
  source
  identifyId
  notificationToken
  locale
  userAgent
  lastActiveAt
  ua {
    ua
    browser {
      name
      version
    }
    device {
      model
      type
      vendor
    }
    engine {
      name
      version
    }
    os {
      name
      version
    }
    cpu {
      architecture
    }
  }
}
