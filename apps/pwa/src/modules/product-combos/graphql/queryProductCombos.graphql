query ProductCombos($limit: Float, $offset: Float, $query: JSONObject) {
  list: productCombos(limit: $limit, offset: $offset, query: $query) {
    total
    results {
      refs
      createdAt
      updatedAt
      id
      _count
      _id
      productId
      customerId
      sourceId
      expireAt
      status
    }
  }
}