name: Build & Release PWA

on:
  push:
    branches: ["staging", "production"]
    paths:
      - "package.json"
      - "packages/**"
      - "apps/pwa/**"
      - ".github/docker/push-pwa.dockerfile"
      - ".github/workflows/push-pwa.yaml"
  workflow_dispatch:

env:
  DOCKERFILE_PATH: .github/docker/push-pwa.dockerfile

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup ENV
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          sed -i "s/ENV = \"development\"/ENV = \"${BRANCH_NAME}\"/g" packages/config/index.ts

      - name: Generate .env file from CLIENT_ENVIRONMENTS
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          ENVIRONMENTS="${{ vars.CLIENT_ENVIRONMENTS }}"
          
          # Create packages/config directory if it doesn't exist
          mkdir -p packages/config
          
          # Write environments to temporary file
          echo "$ENVIRONMENTS" > /tmp/client-environments.env
          
          # Extract the section for the current branch
          # Look for the section starting with ENV=${BRANCH_NAME}
          IN_SECTION=false
          ENV_CONTENT=""
          
          while IFS= read -r line || [ -n "$line" ]; do
            # Check if this line starts a new ENV section
            if [[ "$line" =~ ^ENV= ]]; then
              # If we were in a section, we've reached the next one
              if [[ "$IN_SECTION" == true ]]; then
                break
              fi
              # Check if this is our target branch
              if [[ "$line" == "ENV=${BRANCH_NAME}" ]]; then
                IN_SECTION=true
                ENV_CONTENT="${line}"$'\n'
              fi
            elif [[ "$IN_SECTION" == true ]]; then
              # If we're in the target section, collect the line
              # Stop if we hit an empty line (section separator)
              if [[ -z "$line" ]]; then
                break
              fi
              ENV_CONTENT="${ENV_CONTENT}${line}"$'\n'
            fi
          done < /tmp/client-environments.env
          
          # Write the extracted content to packages/config/.env
          echo -n "$ENV_CONTENT" > packages/config/.env
          
          # Clean up
          rm -f /tmp/client-environments.env
          
          echo "Generated packages/config/.env for ${BRANCH_NAME} environment"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./apps/pwa/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "PWA version: $VERSION"

      - name: Generate image tags
        id: meta
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          RUN_NUMBER="${{ github.run_number }}"
          
          # Set IMAGE_NAME: include branch name only for non-production branches
          if [[ "${BRANCH_NAME}" == "production" ]]; then
            IMAGE_NAME="joy-one-client-pwa"
          else
            IMAGE_NAME="joy-one-client-pwa-${BRANCH_NAME}"
          fi
          
          IMAGE_TAG="${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME}"
          GIT_REF="${{ github.ref }}"
          GIT_SHA="${{ github.sha }}"
          PACKAGE_VERSION="${{ steps.version.outputs.version }}"

          # Always tag as latest
          TAGS="${IMAGE_TAG}:latest,${IMAGE_TAG}:v${PACKAGE_VERSION}-${RUN_NUMBER}"
          
          # Full image name for release
          IMAGE_NAME_FULL="${IMAGE_TAG}:v${PACKAGE_VERSION}-${RUN_NUMBER}"

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "package_version=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME_FULL}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"
          echo "Image name for release: ${IMAGE_NAME_FULL}"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  release-dokploy:
    name: Release Dokploy
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Parse environment variables from .env format
        id: parse-env
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          
          # Get the .env format string from vars
          if [[ "${BRANCH_NAME}" == "production" ]]; then
            ENV_STRING="${{ vars.DOKPLOY_PRODUCTION }}"
            echo "dokploy_token=${{ secrets.DOKPLOY_PRODUCTION_TOKEN }}" >> $GITHUB_OUTPUT
          elif [[ "${BRANCH_NAME}" == "staging" ]]; then
            ENV_STRING="${{ vars.DOKPLOY_STAGING }}"
            echo "dokploy_token=${{ secrets.DOKPLOY_STAGING_TOKEN }}" >> $GITHUB_OUTPUT
          else
            echo "Unknown branch: ${BRANCH_NAME}"
            exit 1
          fi
          
          # Write .env string to temporary file for parsing
          echo "$ENV_STRING" > /tmp/dokploy.env
          
          # Parse .env format and extract values
          while IFS='=' read -r key value || [ -n "$key" ]; do
            # Skip empty lines and comments
            [[ -z "$key" ]] && continue
            [[ "$key" =~ ^[[:space:]]*# ]] && continue
            
            # Remove leading/trailing whitespace
            key=$(echo "$key" | xargs)
            value=$(echo "$value" | xargs)
            
            # Skip if value is empty
            [[ -z "$value" ]] && continue
            
            case "$key" in
              URL)
                echo "dokploy_url=${value}" >> $GITHUB_OUTPUT
                ;;
              CLIENT_PWA_ID)
                echo "dokploy_app_id=${value}" >> $GITHUB_OUTPUT
                ;;
            esac
          done < /tmp/dokploy.env
          
          # Clean up
          rm -f /tmp/dokploy.env

      - name: Run release Dokploy
        env:
          DOKPLOY_TOKEN: ${{ steps.parse-env.outputs.dokploy_token }}
          DOKPLOY_URL: ${{ steps.parse-env.outputs.dokploy_url }}
          DOKPLOY_IMAGE: ${{ needs.build-and-push.outputs.image_name }}
          DOKPLOY_APPLICATION_ID: ${{ steps.parse-env.outputs.dokploy_app_id }}
        run: node .github/release-dokploy.js
