name: Build & Push PWA Docker Image

on:
  push:
    branches: ["staging", "production"]
  workflow_dispatch:

env:
  DOCKERFILE_PATH: .deploy/push-pwa.dockerfile

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      package_version: ${{ steps.version.outputs.version }}
      image_name: ${{ steps.meta.outputs.image_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./apps/pwa/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "PWA version: $VERSION"

      - name: Generate image tags
        id: meta
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          IMAGE_NAME="joy-one-client-pwa-${BRANCH_NAME}"
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}"
          GIT_REF="${{ github.ref }}"
          GIT_SHA="${{ github.sha }}"
          PACKAGE_VERSION="${{ steps.version.outputs.version }}"

          # Always tag as latest
          TAGS="${IMAGE_TAG}:latest,${IMAGE_TAG}:${PACKAGE_VERSION}-${GITHUB_RUN_NUMBER}"
          
          # Full image name for release
          IMAGE_NAME_FULL="${IMAGE_TAG}:${PACKAGE_VERSION}-${GITHUB_RUN_NUMBER}"

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "package_version=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME_FULL}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"
          echo "Image name for release: ${IMAGE_NAME_FULL}"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  release-dokploy:
    name: Release Dokploy
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Set environment variables based on branch
        id: set-env
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          
          if [[ "${BRANCH_NAME}" == "production" ]]; then
            echo "dokploy_url=${{ vars.DOKPLOY_PRODUCTION_URL }}" >> $GITHUB_OUTPUT
            echo "dokploy_token=${{ secrets.DOKPLOY_PRODUCTION_TOKEN }}" >> $GITHUB_OUTPUT
            echo "dokploy_app_id=${{ vars.DOKPLOY_PRODUCTION_JOY_ONE_CLIENT_PWA_ID }}" >> $GITHUB_OUTPUT
          elif [[ "${BRANCH_NAME}" == "staging" ]]; then
            echo "dokploy_url=${{ vars.DOKPLOY_STAGING_URL }}" >> $GITHUB_OUTPUT
            echo "dokploy_token=${{ secrets.DOKPLOY_STAGING_TOKEN }}" >> $GITHUB_OUTPUT
            echo "dokploy_app_id=${{ vars.DOKPLOY_STAGING_JOY_ONE_CLIENT_PWA_ID }}" >> $GITHUB_OUTPUT
          else
            echo "Unknown branch: ${BRANCH_NAME}"
            exit 1
          fi

      - name: Run release Dokploy
        env:
          DOKPLOY_TOKEN: ${{ steps.set-env.outputs.dokploy_token }}
          DOKPLOY_URL: ${{ steps.set-env.outputs.dokploy_url }}
          DOKPLOY_IMAGE: ${{ needs.build-and-push.outputs.image_name }}
          DOKPLOY_APPLICATION_ID: ${{ steps.set-env.outputs.dokploy_app_id }}
        run: node .github/release-dokploy.js
